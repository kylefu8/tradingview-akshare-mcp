[project]
name = "tradingview-akshare-mcp"
version = "1.0.0"
description = "A股市场技术分析 MCP Server，基于 AKShare 数据源"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenCode User"}
]
keywords = ["mcp", "akshare", "stock", "a-share", "technical-analysis", "china", "tradingview"]

dependencies = [
    "mcp>=1.0.0",
    "akshare>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",  # 用于 parquet 格式本地缓存
]

[project.scripts]
tradingview-akshare-mcp = "tradingview_akshare_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradingview_akshare_mcp"]
